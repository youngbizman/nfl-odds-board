# Render Blueprint: one small always-on Node web service in US-East (Ohio), close to both books' US infrastructure.
services:
  - type: web
    name: nfl-odds-board
    runtime: node
    region: ohio
    plan: free
    # npm ci also runs tools/install-transport.mjs (RENDER=true): a .venv with curl_cffi for DraftKings' snapshot host.
    # BetMGM: its odds API only answers a real browser page, so a headless Chromium shell is installed next to
    # node_modules (PLAYWRIGHT_BROWSERS_PATH=0). If it cannot start here, BetMGM comes from the edge (EDGE_MGM=1).
    buildCommand: npm ci --omit=dev && npx playwright install chromium-headless-shell
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: SOURCES
        value: draftkings,fanduel,betmgm
      - key: MGM_POLL_MS
        value: "2000"
      - key: MGM_STALE_MS
        value: "15000"
      - key: MGM_BROWSER
        value: "1"
      - key: FD_POLL_MS
        value: "1000"
      - key: FD_REGION
        value: "ON"
      - key: FD_PUSH
        value: "1"
      - key: DK_SITE
        value: CA-ON-SB
      - key: DK_SITENAME
        value: dkcaon
      - key: DK_WS_HOST
        value: sportsbook-ws-ca-on.draftkings.com
