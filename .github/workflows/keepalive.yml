name: keep awake
# The free Render instance sleeps after 15 idle minutes; a sleeping instance would also drop DraftKings' socket.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: curl -fsS --max-time 60 https://nfl-odds-board-hgim.onrender.com/healthz
